[defaults]
host_key_checking=True

[all:vars]
ansible_user=<changeme>
vip_address=<vip address for the mail relay cluster>
mail_user=<dedicated user for running Postfix>
mail_user_uid=<dedicated user UID for running Postfix>
fqdn=<mail relay fqdn>
relay_host=<upstream SMTP server address>
relay_port=<upstream SMTP port>
relay_user=<upstream SMTP username>
relay_password=<upstream SMTP password>
mynetworks=<space-separated internal CIDRs, e.g. 10.0.0.0/8 192.168.0.0/16>

[mail_nodes]
node1 ansible_host=<node1 ip> vrrp_priority=100 vrrp_state=MASTER
node2 ansible_host=<node2 ip> vrrp_priority=90  vrrp_state=BACKUP
node3 ansible_host=<node3 ip> vrrp_priority=80  vrrp_state=BACKUP
